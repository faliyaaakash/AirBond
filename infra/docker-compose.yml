version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  coturn:
    image: coturn/coturn:latest
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    # external-ip must be the host machine's real LAN IP (not localhost/127.0.0.1)
    # for relay candidates to be reachable from other devices - see infra/.env.example.
    command: -c /etc/coturn/turnserver.conf --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1} --min-port=49160 --max-port=49200

volumes:
  redis_data:
  mongo_data:
